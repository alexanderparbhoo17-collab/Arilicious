<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<title>For Arilyn</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap');
:root{--gold:#c9ad7a;--paper:#eee8dc;--ink:#17130f;--muted:#a69b89}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:#090909;color:#eee8dc;font-family:'DM Sans',sans-serif;overflow:hidden}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 44%,#27231d 0%,#12110f 42%,#080808 78%);z-index:-2}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.12;z-index:-1;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E")}
main{width:min(94vw,650px);padding:40px 16px;text-align:center}
.overline{font-size:9px;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);margin-bottom:23px}
h1{font:400 clamp(34px,6vw,51px)/1.05 'Cormorant Garamond',serif;letter-spacing:.015em;margin:0;color:#f0e9dc}
h1 span{font-style:italic;color:var(--gold)}
.intro{font:italic 17px 'Cormorant Garamond',serif;color:#a9a092;margin:16px 0 48px}
.stage{height:300px;display:grid;place-items:center;perspective:1400px}
.envelope{position:relative;width:min(82vw,390px);height:238px;cursor:pointer;outline:none;filter:drop-shadow(0 30px 35px #000b);transition:transform .4s ease}
.envelope:hover{transform:translateY(-5px)}
.env-back{position:absolute;inset:0;background:#d8d0c2;border:1px solid #b9ad9b}
.paper{position:absolute;left:6%;width:88%;height:200px;bottom:13px;background:linear-gradient(135deg,#f7f3ea,#e8dfd0);z-index:2;display:grid;place-items:center;box-shadow:0 3px 12px #0002;transform:translateY(0);transition:transform 1.15s cubic-bezier(.2,.75,.2,1)}
.paper:before{content:"";position:absolute;inset:10px;border:1px solid #d3c6b1;pointer-events:none}
.paper-message{font:italic clamp(30px,6vw,43px)/1.2 'Cormorant Garamond',serif;color:#34271f;opacity:0;transform:translateY(10px);transition:opacity .7s .75s,transform .7s .75s}
.paper-message small{display:block;font:10px 'DM Sans',sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#a17e4c;margin-bottom:15px}
.env-front{position:absolute;inset:0;z-index:3;background:linear-gradient(145deg,#e7dfd2,#cfc4b2);clip-path:polygon(0 0,50% 57%,100% 0,100% 100%,0 100%)}
.env-front:after{content:"";position:absolute;inset:0;background:linear-gradient(30deg,transparent 49.7%,#b7aa96 50%,transparent 50.3%),linear-gradient(-30deg,transparent 49.7%,#b7aa96 50%,transparent 50.3%);opacity:.55}
.flap{position:absolute;inset:0 0 auto;height:61%;background:linear-gradient(160deg,#f0eadd,#d9cfbf);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .9s cubic-bezier(.2,.7,.2,1);z-index:4;backface-visibility:hidden}
.address{position:absolute;z-index:4;top:34px;left:0;right:0;color:#4d4032;display:flex;align-items:center;flex-direction:column;gap:6px;pointer-events:none}
.address small{font:8px 'DM Sans',sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#88765e}
.address strong{font:italic 31px 'Cormorant Garamond',serif;font-weight:500;letter-spacing:.04em}
.address i{font-style:normal;color:#9d8055;font-size:12px}
.seal{position:absolute;z-index:5;left:50%;top:54%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#d5bd8c,#927449 72%);border:1px solid #e2cfaa;box-shadow:0 4px 12px #4c3c2655;color:#201a11;font:500 17px 'Cormorant Garamond',serif;transition:opacity .25s}
.envelope.open .flap{transform:rotateX(180deg);z-index:1}
.envelope.open .paper{transform:translateY(-125px);transition-delay:.25s;z-index:5}
.envelope.open .paper-message{opacity:1;transform:translateY(0)}
.envelope.open .seal,.envelope.open .address{opacity:0}
.instruction{margin-top:18px;color:#9e927e;font-size:9px;letter-spacing:.3em;text-transform:uppercase;transition:opacity .3s}
.signature{font:italic 16px 'Cormorant Garamond',serif;color:var(--gold);margin-top:19px;opacity:0;transition:opacity .8s 1s}
.envelope.open~.signature{opacity:1}
.bottom{margin-top:62px;font-size:8px;letter-spacing:.3em;text-transform:uppercase;color:#665e52}
@media(max-width:440px){.stage{height:275px}.envelope{height:215px}.paper{height:185px}.intro{margin-bottom:35px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body><div class="grain"></div>
<main>
  <div class="overline">A private note · sealed with love</div>
  <h1>For <span>Arilyn</span></h1>
  <p class="intro">Some things are better opened slowly.</p>
  <div class="stage">
    <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Open your letter">
      <div class="env-back"></div>
      <div class="paper"><div class="paper-message"><small>With all my heart</small>I love you,<br>Arilyn.</div></div>
      <div class="env-front"></div>
      <div class="address"><small>Especially for</small><strong>Arilyn</strong><i>✧</i></div>
      <div class="flap"></div>
      <div class="seal">A</div>
    </div>
  </div>
  <div class="instruction" id="instruction">Touch to open</div>
  <div class="signature">Always yours. <span style="font-family:serif">♡</span></div>
  <div class="bottom">Made just for you</div>
</main>
<script>
const env=document.getElementById('envelope'),instruction=document.getElementById('instruction');
function toggle(){const open=env.classList.toggle('open');instruction.textContent=open?'Touch to close':'Touch to open';document.querySelector('h1').innerHTML=open?'A note, <span>just for you</span>':'For <span>Arilyn</span>';}
env.addEventListener('click',toggle);
env.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}});
</script>
</body>
</html>
